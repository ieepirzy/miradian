# ── miradian ─────────────────────────────────────────────────────────────────
# Secrets (MCP_CLIENT_ID, MCP_CLIENT_SECRET, MCP_BASE_URL, VAULT_PATH) come from
# the environment -- a .env file, or your orchestrator's env-var UI. Do not
# commit them.
#
# BOUND_IP is the host address the server is published on, and it should be a
# specific interface, never 0.0.0.0. Bind it to a VPN or private address (e.g. a
# WireGuard peer address) so the port is unreachable from the LAN or the internet
# regardless of router configuration. It defaults to loopback.

services:
  miradian:
    build: .
    container_name: miradian
    restart: unless-stopped
    volumes:
      - ${VAULT_PATH}:/vault
    environment:
      VAULT_PATH: /vault
      MCP_BASE_URL: ${MCP_BASE_URL}
      MCP_CLIENT_ID: ${MCP_CLIENT_ID}
      MCP_CLIENT_SECRET: ${MCP_CLIENT_SECRET}
      MCP_AUTO_APPROVE: ${MCP_AUTO_APPROVE:-true}
      MCP_PUBLIC_REGISTRATION: ${MCP_PUBLIC_REGISTRATION:-false}
      MCP_TOKEN_TTL: ${MCP_TOKEN_TTL:-3600}
      MCP_REFRESH_TOKEN_TTL: ${MCP_REFRESH_TOKEN_TTL:-2592000}
      MCP_PATH: ${MCP_PATH:-/mcp}
      SSE_PATH: ${SSE_PATH:-/sse}
    ports:
      - "${BOUND_IP:-127.0.0.1}:${PORT:-27125}:8000"
    security_opt:
      - no-new-privileges:true

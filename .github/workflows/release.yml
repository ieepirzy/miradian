name: Release

# Triggered when you publish a new GitHub Release.
#
# miradian is a container, not a Python package, so this publishes the image to
# GHCR rather than to PyPI (the shape origo's release.yml uses). Authentication
# is the built-in GITHUB_TOKEN -- no secret to configure.
#
# Images land at ghcr.io/<owner>/miradian, tagged with the release tag (e.g.
# v0.1.0), the major.minor, and latest.
#
# The package is private by default: after the first release, make it public at
#   github.com/users/<owner>/packages/container/miradian/settings
# if you want people to be able to pull it without authenticating.

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push image to GHCR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/miradian
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

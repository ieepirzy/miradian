name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        run: pytest --tb=short -q

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The unit tests never touch the Dockerfile, and a container app whose
      # image stops building is broken regardless of how green pytest is.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Run gitleaks directly rather than via gitleaks-action. On a push the
      # action scans the range <before>^..<after>, and on the first push to a new
      # repo <before> is the root commit -- so `root^` is an unknown revision,
      # git aborts, and the action scans ~0 bytes and then still exits 1. Red
      # build, zero coverage. Invoking gitleaks ourselves scans the full history
      # (fetch-depth: 0 above), and sidesteps the action's deprecated Node 20.
      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:v8.24.3 detect --source=/repo --redact -v

  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./
